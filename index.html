<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Earth Looper — EarthOS v5</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --ink:#0b0f14; --surface:#111720; --panel:rgba(10,14,20,0.97);
  --rim:rgba(255,255,255,0.07); --muted:rgba(255,255,255,0.28);
  --body:rgba(255,255,255,0.72); --head:rgba(255,255,255,0.94);
  --accent:#e8c97a; --mono:'JetBrains Mono',monospace; --sans:'Inter',sans-serif;
}
html,body { width:100%; height:100%; overflow:hidden; background:var(--ink); color:var(--body); font-family:var(--sans); }
canvas { display:block; width:100%; height:100%; touch-action:none; }
#vig  { position:fixed; inset:0; pointer-events:none; z-index:3;
        background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,0.55) 100%); }
#wrap { position:fixed; inset:0; transition:bottom .42s cubic-bezier(.32,0,.12,1); display:flex; }
#wrap.panel-open { bottom:55vh; }
@media(min-width:640px){ #wrap.panel-open { bottom:0; } }

/* Top bar */
#top { position:fixed; top:0; left:0; right:0; z-index:20; display:flex;
       align-items:center; justify-content:flex-start; padding:14px 20px;
       background:linear-gradient(to bottom,rgba(11,15,20,.9) 0%,transparent 100%);
       pointer-events:auto; gap:14px; }
.brand { font-family:var(--mono); font-size:10px; font-weight:500;
         letter-spacing:.18em; text-transform:uppercase; color:var(--muted); white-space:nowrap; flex-shrink:0; }
.brand b { color:var(--head); font-weight:500; }

/* Search */
#swrap { position:fixed; top:56px; right:16px; z-index:20; pointer-events:auto; }
#si { background:rgba(11,15,20,.88); border:1px solid var(--rim); border-radius:6px;
      color:var(--body); font-family:var(--mono); font-size:10px; padding:6px 10px;
      width:160px; outline:none; letter-spacing:.05em; backdrop-filter:blur(12px); transition:border-color .18s; }
#si:focus { border-color:rgba(255,255,255,.22); }
#si::placeholder { color:var(--muted); }
#sr { position:absolute; top:calc(100% + 4px); left:0; right:0;
      background:rgba(10,14,20,.98); border:1px solid var(--rim); border-radius:8px;
      display:none; max-height:200px; overflow-y:auto; backdrop-filter:blur(20px);
      z-index:30; box-shadow:0 8px 32px rgba(0,0,0,.6); }
.sri { padding:9px 12px; cursor:pointer; font-size:11px; border-bottom:1px solid var(--rim);
       display:flex; align-items:center; gap:8px; }
.sri:hover { background:rgba(255,255,255,.06); }

/* Top bar clock */
#eos-clk {
  flex-shrink:0; font-family:var(--mono); font-size:10px;
  color:rgba(255,255,255,0.28); letter-spacing:.1em; white-space:nowrap;
  padding-left:12px;
}

/* Boot screen */
#eos-boot {
  position:fixed; inset:0; z-index:9999; background:#0b0f14;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:20px; transition:opacity .5s ease;
}
#eos-boot.fade { opacity:0; pointer-events:none; }
.eos-boot-logo {
  font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:500;
  letter-spacing:.28em; text-transform:uppercase; color:rgba(255,255,255,0.9);
}
.eos-boot-logo span { color:#e8c97a; }
.eos-boot-sub {
  font-family:'JetBrains Mono',monospace; font-size:10px;
  color:rgba(255,255,255,0.28); letter-spacing:.18em; text-transform:uppercase;
}
.eos-boot-bar {
  width:160px; height:2px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden;
}
.eos-boot-fill {
  height:100%; background:#e8c97a; border-radius:2px;
  animation:eos-boot-progress 1.6s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes eos-boot-progress {
  from { width:0; } to { width:100%; }
}
</style>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/fonts.css">
<!-- Redirect all Three.js CDN imports to local node_modules (no internet required) -->
<script type="importmap">
{
  "imports": {
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js": "./node_modules/three/build/three.module.js"
  }
}
</script>
</head>
<body>
<!-- Boot screen -->
<div id="eos-boot">
  <div class="eos-boot-logo">EARTH<span>OS</span></div>
  <div class="eos-boot-sub">Digital Twin v5 · Offline Mode</div>
  <div class="eos-boot-bar"><div class="eos-boot-fill"></div></div>
</div>

<div id="vig"></div>
<div id="wrap"><canvas id="c"></canvas></div>

<!-- Top bar -->
<div id="top">
  <div class="brand"><b>EARTH</b>OS <span style="opacity:.4">v5</span></div>
  <button id="eos-layers-btn"></button>
</div>

<!-- Search -->
<div id="swrap">
  <input id="si" type="text" placeholder="País / región…" autocomplete="off" spellcheck="false">
  <div id="sr"></div>
</div>

<!-- EarthOS Bootstrap -->
<script type="module">
// Three.js — loaded as ES module, exposed as window.THREE for legacy plugins
import * as _THREE from './node_modules/three/build/three.module.js';
window.THREE = _THREE;

// ── Core ───────────────────────────────────────────────────────────────────
import engine                           from './core/engine.js';
import { workerPool }                   from './core/workerPool.js';
import timeEngine                       from './core/timeEngine.js';
import bus, { Events }                  from './core/eventBus.js';

// ── Renderer ───────────────────────────────────────────────────────────────
import { Renderer }                     from './render/renderer.js';
import GlobePlugin                      from './render/globe.js';
import { EarthquakeLayerRenderer }      from './render/layers/earthquakeLayer.js';
import { FireLayerRenderer }            from './render/layers/fireLayer.js';
import { FlightLayerRenderer }          from './render/layers/flightLayer.js';
import { ShipLayerRenderer }            from './render/layers/shipLayer.js';
import { SatelliteLayerRenderer }       from './render/layers/satelliteLayer.js';
import { VolcanoLayerRenderer }         from './render/layers/volcanoLayer.js';
import WindLayer                        from './render/layers/windLayer.js';
import OceanLayer                       from './render/layers/oceanLayer.js';
import ConflictLayer                    from './render/layers/conflictLayer.js';
import EconomyLayer                     from './render/layers/economyLayer.js';
import BorderLayer                      from './render/layers/borderLayer.js';
import PollutionLayer                   from './render/layers/pollutionLayer.js';
import NightLayer                       from './render/layers/nightLayer.js';

// ── UI ─────────────────────────────────────────────────────────────────────
import { PanelUI }                      from './ui/panel.js';
import { LayerMenuUI }                  from './ui/layerMenu.js';
import { SearchUI }                     from './ui/search.js';
import { NotificationSystem }           from './ui/notifications.js';
import { TimelineUI }                   from './ui/timeline.js';
import CausalChainPanel                 from './ui/causalChainPanel.js';
import ExportPanel                      from './ui/exportPanel.js';
import CountryCompare                   from './ui/countryCompare.js';
import PerfMonitor                      from './ui/perfMonitor.js';
import KeyboardShortcuts                from './ui/keyboardShortcuts.js';
import LiveIndicator                    from './ui/liveIndicator.js';
import windowManager                    from './ui/windowManager.js';
import Dock                             from './ui/dock.js';
import contextMenu                      from './ui/contextMenu.js';

// ── Apps ───────────────────────────────────────────────────────────────────
import TerminalApp                      from './apps/terminal.js';
import DataExplorerApp                  from './apps/dataExplorer.js';
import SystemMonitorApp                 from './apps/systemMonitor.js';
import ScenarioRunnerApp                from './apps/scenarioRunner.js';
import SettingsApp                      from './apps/settings.js';
import AssistantApp                     from './apps/assistant.js';
import AlertManagerApp                  from './apps/alertManager.js';

// ── Persistence ────────────────────────────────────────────────────────────
import persistence                      from './core/persistence.js';
import NotificationCenter               from './ui/notificationCenter.js';
import alertEngine                      from './core/alertEngine.js';

// ── Sources ────────────────────────────────────────────────────────────────
import { USGSSource }                   from './sources/usgs.js';
import { EONETSource }                  from './sources/eonet.js';
import { FIRMSSource }                  from './sources/firms.js';
import { OpenSkySource }                from './sources/opensky.js';
import { OpenAQSource }                 from './sources/openaq.js';
import { AISStreamSource }              from './sources/aisstream.js';
import { TLESource }                    from './sources/tle.js';
import { NOAASource }                   from './sources/noaa.js';
import { CopernicusSource }             from './sources/copernicus.js';
import { ACLEDSource }                  from './sources/acled.js';
import { WorldBankSource }              from './sources/worldbank.js';

// ── AI / Simulation ────────────────────────────────────────────────────────
import causalGraph                      from './ai/causalGraph.js';
import eventAnalyzer                    from './ai/eventAnalyzer.js';
import insights                         from './ai/insights.js';
import assistant                        from './ai/assistant.js';
import windSim                          from './simulation/windSim.js';
import historyBuffer                    from './core/historyBuffer.js';
import scenarioEngine                   from './simulation/scenarioEngine.js';

// ── Config ─────────────────────────────────────────────────────────────────
import { COUNTRIES }                    from './config/countries.js';
import SOURCE_CONFIG                    from './config/sources.js';

// ── Boot sequence ──────────────────────────────────────────────────────────
console.time('[EarthOS] boot');
await engine.init({ debug: false });

// Worker pool (off-main-thread processing)
workerPool.init();

// Renderer
const canvas   = document.getElementById('c');
const renderer = new Renderer(canvas);
await renderer.init();

// Globe + layer renderers
renderer.addPlugin('globe',      new GlobePlugin());
renderer.addPlugin('eq-layer',   new EarthquakeLayerRenderer());
renderer.addPlugin('fire-layer', new FireLayerRenderer());
renderer.addPlugin('vol-layer',  new VolcanoLayerRenderer());
renderer.addPlugin('flt-layer',  new FlightLayerRenderer());
renderer.addPlugin('shp-layer',  new ShipLayerRenderer());
renderer.addPlugin('sat-layer',  new SatelliteLayerRenderer());
renderer.addPlugin('wind-layer', new WindLayer());
renderer.addPlugin('ocean-layer',new OceanLayer());
renderer.addPlugin('conf-layer', new ConflictLayer());
renderer.addPlugin('gdp-layer',  new EconomyLayer());
renderer.addPlugin('border-layer', new BorderLayer());
renderer.addPlugin('pol-layer',  new PollutionLayer());
renderer.addPlugin('night-layer', new NightLayer());

// UI
const panel      = new PanelUI();
const layerMenu  = new LayerMenuUI();
const search     = new SearchUI(COUNTRIES);
const notifs     = new NotificationSystem();
const timeline   = new TimelineUI();
const causalPanel   = new CausalChainPanel();
const exportPanel   = new ExportPanel(canvas);
const countryComp   = new CountryCompare();
const perfMonitor   = new PerfMonitor();
const shortcuts     = new KeyboardShortcuts();
const liveIndicator = new LiveIndicator();

panel.init();
layerMenu.init();
search.init();
notifs.init();
timeline.init();
causalPanel.init();
exportPanel.init();
countryComp.init();
perfMonitor.init();
shortcuts.init();
liveIndicator.init();

// ── Window Manager + Context Menu ─────────────────────────────────────────
windowManager.init();
contextMenu.init();

// ── Apps ──────────────────────────────────────────────────────────────────
const termApp      = new TerminalApp();
const explorerApp  = new DataExplorerApp();
const monitorApp   = new SystemMonitorApp();
const scenarioApp  = new ScenarioRunnerApp();
const settingsApp  = new SettingsApp();
const assistantApp = new AssistantApp();
const alertMgrApp  = new AlertManagerApp();

// ── Notification Center + Alert Engine ────────────────────────────────────
const notifCenter = new NotificationCenter();
notifCenter.init();
alertEngine.init();

// ── Dock ──────────────────────────────────────────────────────────────────
const dock = new Dock();
dock.init([
  assistantApp,
  termApp,
  explorerApp,
  monitorApp,
  '---',
  scenarioApp,
  alertMgrApp,
  settingsApp,
]);

engine.setRenderer(renderer);

// ── Data sources ──────────────────────────────────────────────────────────
if (SOURCE_CONFIG.usgs.enabled)
  engine.registerSource('usgs',        new USGSSource(SOURCE_CONFIG.usgs));
if (SOURCE_CONFIG.eonet.enabled)
  engine.registerSource('eonet',       new EONETSource(SOURCE_CONFIG.eonet));
if (SOURCE_CONFIG.firms.enabled)
  engine.registerSource('firms',       new FIRMSSource(SOURCE_CONFIG.firms));
if (SOURCE_CONFIG.opensky.enabled)
  engine.registerSource('opensky',     new OpenSkySource(SOURCE_CONFIG.opensky));
if (SOURCE_CONFIG.openaq.enabled)
  engine.registerSource('openaq',      new OpenAQSource(SOURCE_CONFIG.openaq));
if (SOURCE_CONFIG.aisstream.enabled)
  engine.registerSource('aisstream',   new AISStreamSource(SOURCE_CONFIG.aisstream));
if (SOURCE_CONFIG.noaa.enabled)
  engine.registerSource('noaa',        new NOAASource(SOURCE_CONFIG.noaa));
if (SOURCE_CONFIG.copernicus.enabled)
  engine.registerSource('copernicus',  new CopernicusSource(SOURCE_CONFIG.copernicus));
if (SOURCE_CONFIG.acled.enabled)
  engine.registerSource('acled',       new ACLEDSource(SOURCE_CONFIG.acled));
if (SOURCE_CONFIG.worldbank.enabled)
  engine.registerSource('worldbank',   new WorldBankSource(SOURCE_CONFIG.worldbank));

// TLE satellites — always on (CelesTrak is public)
engine.registerSource('tle', new TLESource({ catalogs: ['stations', 'starlink', 'gps_ops'] }));

// ── AI engines initialised by import side-effects ─────────────────────────
// causalGraph, eventAnalyzer, insights — active listeners from module load

// ── Globe click → country panel ──────────────────────────────────────────
bus.on(Events.COUNTRY_SELECTED, ({ lat, lon, country }) => {
  if (country) { panel.showCountry(country); return; }
  let nearest = null, best = Infinity;
  for (const [iso, c] of Object.entries(COUNTRIES)) {
    const d = Math.hypot(c.lat - lat, c.lon - lon);
    if (d < best) { best = d; nearest = { ...c, iso }; }
  }
  if (nearest && best < 15) panel.showCountry(nearest);
});

// ── UTC clock — appended to top bar after dock ────────────────────────────
const clk = document.createElement('div');
clk.id = 'eos-clk';
document.getElementById('top')?.appendChild(clk);
const tick = () => { clk.textContent = new Date().toUTCString().slice(17,25) + ' UTC'; };
tick(); setInterval(tick, 1000);

// ── Context menu on globe (right-click) ───────────────────────────────────
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  contextMenu.show(e.clientX, e.clientY, [
    { icon:'🌍', label:'Earth Assistant',     action: () => assistantApp.launch() },
    { icon:'🔍', label:'Data Explorer',       action: () => explorerApp.launch()  },
    { icon:'🔮', label:'Run Scenario',        action: () => scenarioApp.launch()  },
    { icon:'📊', label:'System Monitor',      action: () => monitorApp.launch()   },
    '---',
    { icon:'💻', label:'Terminal',            action: () => termApp.launch()      },
    { icon:'🚨', label:'Alert Manager',       action: () => alertMgrApp.launch()  },
    { icon:'⚙️', label:'Settings',            action: () => settingsApp.launch()  },
  ]);
});

// ── Sync initial layer visibility with LAYER_DEFS enabled states ─────────
// Renderers start with visible=false; this fires the initial toggle so
// layers marked enabled:true become visible without requiring user interaction.
for (const layer of engine.layers.all()) {
  bus.emit(Events.LAYER_TOGGLE, { id: layer.id, enabled: layer.enabled });
}

// ── Restore persisted layer states (overrides defaults) ──────────────────
for (const layer of engine.status().layers) {
  const saved = persistence.load(`layer_${layer.id}`);
  if (saved !== null) bus.emit(Events.LAYER_TOGGLE, { id: layer.id, enabled: saved });
}

// ── Start ─────────────────────────────────────────────────────────────────
renderer.start();
await engine.start();
timeEngine.goLive();

// ── Dismiss boot screen ───────────────────────────────────────────────────
const bootEl = document.getElementById('eos-boot');
if (bootEl) {
  bootEl.classList.add('fade');
  setTimeout(() => { bootEl.remove(); assistantApp.launch(); }, 700);
}

console.timeEnd('[EarthOS] boot');
console.log('[EarthOS] Status:', engine.status());
console.log('[EarthOS] Graph:', causalGraph.size());
console.log('[EarthOS] History:', historyBuffer.stats());

// Expose scenario engine on window for devtools/console use
window.EarthOS = { engine, timeEngine, causalGraph, eventAnalyzer, historyBuffer, scenarioEngine, alertEngine, assistant };

// ── Service Worker (PWA) ───────────────────────────────────────────────────
// Service worker disabled — clears any stale SW and its cache
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => Promise.all(regs.map(r => r.unregister())))
    .catch(() => {});
}

</script>
</body>
</html>
